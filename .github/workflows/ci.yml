name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: 증거 봉인 도구 의존성 설치
        run: pip install -r tools/opsarchive/requirements.txt

      - name: 증거 봉인 도구 테스트 (앱과 독립 CLI)
        working-directory: tools/opsarchive
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -t . -v

      - name: 백엔드 테스트 (모델 동적 선택 · 최소 30회 시도)
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v

      - name: 측정 스크립트 테스트
        working-directory: backend
        run: python -m unittest scripts/test_measure_score_rate.py

      - name: 지연 측정 스크립트 테스트
        working-directory: backend
        run: python -m unittest scripts/test_measure_latency.py

      - name: 카테고리 파일 검증기 테스트
        working-directory: backend
        run: python -m unittest scripts/test_validate_category.py

      - name: 검증 규칙 점검 (negative_cases)
        working-directory: backend
        run: python scripts/check_negatives.py

      - name: 프론트 테스트
        run: node --test mockup/ai.test.js mockup/tokens.test.js mockup/commons.test.js   # 토큰 가드: 색 리터럴·다크 블록 동일·글자 대비(AA)

      - name: 서버 기동 확인 (/health 에 restaurant, 화면 서빙)
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health > /dev/null && break; sleep 1; done
          curl -s localhost:8000/health | tee health.json
          python -c "import json;d=json.load(open('health.json'));assert 'restaurant' in d['categories'], d;assert d['min_attempts']>=30, d"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = 200

  e2e:
    # 말하기 동의·AI 표시를 실제 브라우저(가짜 마이크)로 확인한다. 서버는 키 없이(목업 응답).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 의존성 설치
        run: |
          pip install -r backend/requirements.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: 동의 · 무음 · 반응형 셸 E2E
        working-directory: backend
        run: |
          # 모든 스위트가 한 서버·한 IP(127.0.0.1)를 나눠 쓴다. 기본 한도(20/60s)면 스위트가 늘수록
          # 뒤쪽 /generate 가 429 를 받아 test_full_regen 이 깨진다. 429 를 검사하는 E2E 는 없다.
          RATE_LIMIT=1000 uvicorn app.main:app --port 8768 &
          for i in $(seq 1 30); do curl -sf localhost:8768/health > /dev/null && break; sleep 1; done
          mkdir -p ../e2e-shots
          python ../e2e/test_account_withdrawal.py http://localhost:8768   # 탈퇴: 버튼 위치·확인·브라우저 기록 폐기
          python ../e2e/test_withdraw_progress.py http://localhost:8768 ../e2e-shots   # 탈퇴 진행 창: 스피너·경과 시간·단계
          python ../e2e/test_login_transition.py http://localhost:8768 ../e2e-shots   # 로그인 전환 화면: 이동 뒤 완료 안내
          python ../e2e/test_consent.py http://localhost:8768 ../e2e-shots
          python ../e2e/test_silence.py http://localhost:8768 ../e2e-shots
          python ../e2e/test_replay_voice.py http://localhost:8768 ../e2e-shots   # 내 발음 다시 듣기(설문 Q14)
          python ../e2e/test_shell.py http://localhost:8768 ../e2e-shots   # 반응형 셸·터치·테마
          python ../e2e/test_speech_text.py http://localhost:8768
          python ../e2e/test_back_nav.py http://localhost:8768   # 하단 뒤로가기 = 이전 화면
          python ../e2e/test_progress_persist.py http://localhost:8768   # 새로고침 진도 유지
          python ../e2e/test_study_popups.py http://localhost:8768   # 미래 날짜 확인 창·다 뒤집으면 자동 완료·축하 창
          python ../e2e/test_conversation_sheet.py http://localhost:8768   # 하단 회화 연습 시트: 말해보기·예상 답변·듣기
          python ../e2e/test_home_settings.py http://localhost:8768   # 새로고침 뒤 여행 복원·D-Day 수정·하단 로그아웃
          python ../e2e/test_account_storage.py http://localhost:8768   # 계정마다 진도·복습 키
          python ../e2e/test_ai_restore.py http://localhost:8768   # 복원 뒤 백그라운드 /generate 로 AI 문장 채우기
          python ../e2e/test_itinerary_screen.py http://localhost:8768   # 오늘 날짜·예시 보고서·하루 블록
          python ../e2e/test_full_regen.py http://localhost:8768   # 설정 화면에서 보고서·문장 완전 재생성
          python ../e2e/test_guest_start.py http://localhost:8768   # Firebase 배포에서도 로그인 없이 시작·새로고침 유지
          python ../e2e/test_login_simple.py http://localhost:8768   # 단순한 로그인 첫 화면 + 이메일 로그인 화면(두 갈래)
          python ../e2e/test_brand.py http://localhost:8768   # 마디 브랜드: 앱 아이콘·매니페스트·로그인 브랜드 줄
          python ../e2e/test_bottom_nav.py http://localhost:8768   # 폰 하단 탭 고정(스크롤·끝 바운스에 끌려가지 않음)
          python ../e2e/test_read_along.py http://localhost:8768   # 따라 읽기: 듣기 중 지금 읽는 단어 강조
          python ../e2e/test_alt_expressions.py http://localhost:8768   # 다른 표현: 시트의 같은 뜻 다른 표현·듣기
          python ../e2e/test_streak.py http://localhost:8768   # 연속 학습·오늘의 목표(카드 10장)
          python ../e2e/test_talk_mode.py http://localhost:8768   # 대화하기(스크립트 회화 1a): 상대가 먼저·힌트·Sorry?·대화 중 점수 없음
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore
