# 증거 봉인 검증키 핀 — '예상 밖 키'가 배포되면 조기에 실패한다.
#
# 왜 cron 인가: 키 대입(substitution)은 배포 순간에 조용히 일어난다. PR 검사만으로는
# 운영 중 교체를 못 잡으므로 주기적으로 /health 의 지문·세대를 핀 파일과 대조한다.
#
# 서드파티 액션을 쓰지 않는다(전부 full commit SHA 로 고정해야 하는 대상이므로 아예 배제하고
# curl + 표준 라이브러리만 쓴다 — tj-actions 사건에서 배운 것).
name: verify-key-pin

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "security/evidence-key-pin.json"
  push:
    branches: [main]
    paths:
      - "security/evidence-key-pin.json"
      - ".github/workflows/verify-key-pin.yml"
      - ".github/scripts/verify_key_pin.py"

permissions:
  contents: read

concurrency:
  group: verify-key-pin
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 핀 파일 가져오기 (GitHub API — 액션 설치 없이)
        env:
          GH_TOKEN: ${{ github.token }}
          # 검사 대상 리비전: PR 이면 그 PR 의 head, 그 외에는 현재 커밋(=기본 브랜치 HEAD).
          # 기본 브랜치에서 읽으면 "핀 파일을 추가하는 PR" 이 404 로 실패한다(실제로 그렇게 실패했다).
          PIN_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/security/evidence-key-pin.json?ref=${PIN_REF}" \
            -o pin.json
          echo "핀 파일:"; cat pin.json

      - name: 검증 스크립트 가져오기
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/verify_key_pin.py?ref=${PIN_REF}" \
            -o .ci/verify_key_pin.py

      - name: 런타임 지문·세대 대조
        run: python3 .ci/verify_key_pin.py pin.json
