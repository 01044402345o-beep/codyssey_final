<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>여행영어 목업</title>
  <script>
    /* 화면 모드: 기본=제품(반응형 셸) · ?demo=1(또는 예전 주소 ?menu=1)=제품+데모 서랍 · ?demo=1&frame=1=예전 데모 레이아웃(폰 프레임+사이드 패널) */
    (function () { var q = new URLSearchParams(location.search); document.documentElement.dataset.mode = q.get('demo') === '1' || q.get('menu') === '1' ? (q.get('frame') === '1' ? 'legacy' : 'demo') : 'product'; })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="api-banner" id="api-banner" hidden></div>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <section class="stage" id="stage"></section>
    </main>
  </div>
  <button class="demo-fab" id="demo-fab" data-act="drawer" aria-label="데모 패널 열기/닫기" hidden>데모</button>
  <div class="toast" id="toast"></div>
  <script src="data.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
