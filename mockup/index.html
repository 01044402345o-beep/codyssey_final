<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행영어 목업</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* 팀 시연용: 주소에 ?menu=1 이 있으면 화면 목록 서랍과 상단바를 켠다.
       없으면 폰에서 앱 화면만 보인다(전시용 껍데기 전부 숨김). */
    try { if (/(?:^|[?&])menu=1(?:&|$)/.test(location.search)) document.documentElement.className += ' menu-on'; } catch (e) {}
  </script>
</head>
<body>
  <input type="checkbox" id="navToggle" class="nav-toggle" hidden>
  <label for="navToggle" class="nav-btn" aria-label="화면 목록 열기">☰</label>
  <label for="navToggle" class="nav-scrim" aria-hidden="true"></label>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <section class="stage" id="stage"></section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="data.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
