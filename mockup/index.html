<!doctype html>
<html lang="ko">

  <meta name="application-name" content="마디">
  <meta name="apple-mobile-web-app-title" content="마디">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fbf8f1" id="theme-color">
  <!-- 테마·화면 모드를 CSS 보다 먼저 정한다(깜빡임 방지). 인라인 스크립트를 두지 않는다 — CSP script-src 에 'unsafe-inline' 없음 -->
  <script src="boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <div class="api-banner" id="api-banner" hidden></div>
  <div class="inapp-banner" id="inapp-banner" role="alert" hidden></div>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <section class="stage" id="stage"></section>
    </main>
  </div>
  <button class="demo-fab" id="demo-fab" data-act="drawer" aria-label="데모 패널 열기/닫기" hidden>데모</button>
  <div class="toast" id="toast"></div>
  <script src="data.js"></script>
  <script src="ai.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
