services:
  - type: web
    name: codyssey-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      # 예비 키(선택, 쉼표로 여러 개). 주 키가 무효·만료·할당량 초과면 넘어가고, 풀리면 주 키로 돌아온다.
      # 주 키와 같은 등급(유료)이어야 한다 — 무료 등급 키는 보낸 내용이 제품 개선에 쓰일 수 있다.
      - key: GEMINI_API_KEY_FALLBACK
        sync: false
      # 실시간 통역(app/interp.py). 켤 엔진과 순서는 INTERP_PROVIDERS(기본 soniox,openai,fake) — 키만 넣어서는 켜지지 않는다. 안내: docs/ops/INTERP_ENGINES.md
      # Azure 를 켜려면 INTERP_PROVIDERS 에 azure 를 넣고 처리방침 3절 표·동의 문구부터 고친다(docs/legal/interp-disclaimer.md).
      - key: SONIOX_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      # 말하기 전사(전용 STT). 순서: groq → openai → assemblyai, 키가 있는 것만 쓴다.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # 교차검증 필수: AssemblyAI(다른 모델 계열 전사). 두 번째 말소리 검출은 로컬 pyannote 모델이라 키가 필요 없다.
      # 로그인(Firebase Authentication). 비어 있으면 화면은 데모 로그인을 유지한다.
      # 아래는 웹 앱 공개 설정이다. 서비스 계정 JSON 은 여기(공개 설정)에 넣지 않는다 —
      # 탈퇴용 키는 맨 아래 FIREBASE_SERVICE_ACCOUNT_JSON 하나로만 받는다.
      # 계정 진도(GET/PUT /user/state)는 이 프로젝트의 Firestore (default) 데이터베이스를 쓴다.
      # 토큰은 사용자 ID 토큰이다. firestore-native-mode 는 쓰지 않는다.
      # 탈퇴(선택)는 아래 FIREBASE_SERVICE_ACCOUNT_JSON 만 추가한다 — 없으면 화면이 폴백 경로로 돌아간다.
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      # 탈퇴(POST /account/erase) 전용 서비스 계정 키. JSON 문자열 전체를 넣는다. 비어 있으면 화면은 폴백 경로로 돌아간다.
      # 절대 저장소에 두지 않는다(docs/deploy/DEPLOY_RUNBOOK.md E).
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # 도시 조사 에이전트(app/research, docs/ops/RESEARCH_AGENT.md). 기본 꺼짐 — 1 이면 POST /research 가 키 없는 공개 소스
      # (위키보이지·위키데이터·Open-Meteo·GOV.UK·Frankfurter)를 조사한다. 결과 캐시는 위 서비스 계정으로 Firestore 에 쓴다.
      - key: RESEARCH_ENABLED
        sync: false
      # 위키미디어 User-Agent 연락처(선택, 기본은 저장소 URL). 없으면 공유 IP 가 익명 한도(10회/분)로 묶일 수 있다.
      - key: WIKIMEDIA_CONTACT
        sync: false
      # langchain-core 가 끌고 오는 langsmith 로 아무것도 나가지 않게(코드도 강제로 끈다).
      - key: LANGSMITH_TRACING
        value: "false"
      # 0 이면 LangGraph 없이 같은 노드를 순서대로(같은 결과). 메모리가 빠듯할 때의 탈출구.
      - key: RESEARCH_USE_GRAPH
        sync: false
      # LLM 추출(여행 조건 순위·한국어 요약) 끄기(기본 켜짐 — Gemini 키가 없으면 저절로 꺼짐), 조사 안 Gemini 동시 수(기본 2)
      - key: RESEARCH_LLM
        sync: false
      # 장소 대체 체인(위키보이지가 모자랄 때): 순서·끄기(none), 종류별 여유 수
      - key: RESEARCH_PLACE_CHAIN
        sync: false
      - key: RESEARCH_PLACE_MIN_EXTRA
        sync: false
      # Google Places(New): 일정 에이전트와 조사의 실시간 보충이 함께 쓴다. 결과는 저장하지 않는다. 한도는 프로세스·UTC 하루
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ITINERARY_DAILY_CAP
        sync: false
      # 한국관광공사 TourAPI(한국 도시 장소 — 저장 가능). 언어별 키가 없으면 공통 TOURAPI_SERVICE_KEY.
      # 일반 인증키는 계정당 하나라 보통 같은 값 — 서비스(언어)마다 활용신청만 따로. 조사는 영문 → 국문 순(TOURAPI_SERVICE 로 강제)
      - key: TOURAPI_SERVICE_KEY
        sync: false
      - key: TOURAPI_KEY_KOR        # 국문 관광정보 서비스_GW (KorService2)
        sync: false
      - key: TOURAPI_KEY_ENG        # 영문 관광정보서비스_GW (EngService2)
        sync: false
      - key: TOURAPI_KEY_FRE        # 불어 관광정보서비스_GW (FreService2) — 지금은 안 씀
        sync: false
      - key: TOURAPI_KEY_JPN        # 일문 관광정보서비스_GW (JpnService2, 활용매뉴얼로 확인) — 지금은 안 씀
        sync: false
      - key: TOURAPI_KEY_CHS        # 중문 간체 관광정보서비스_GW (ChsService2, 활용매뉴얼로 확인) — 지금은 안 씀
        sync: false
      - key: TOURAPI_SERVICE
        sync: false
      - key: RESEARCH_LLM_CONCURRENCY
        sync: false
      # 백업 경로(도시 브리프 GET /city-brief) 끄기(기본 켜짐), /generate 프롬프트에 브리프 넣기(기본 꺼짐)
      - key: CITY_BRIEF_ENABLED
        sync: false
      - key: CITY_BRIEF_PROMPT
        sync: false
