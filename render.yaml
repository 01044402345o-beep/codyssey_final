services:
  - type: web
    name: codyssey-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      # 말하기 전사(전용 STT). 순서: groq → openai → assemblyai, 키가 있는 것만 쓴다.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # 교차검증 필수: AssemblyAI(다른 모델 계열 전사) + pyannoteAI(두 번째 말소리 검출). 없으면 채점하지 않는다.
      - key: PYANNOTEAI_API_KEY
        sync: false
